<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11110e">
    <meta name="description" content="見つけてくれて、ありがとう。">
    <title>発見</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="scene" aria-labelledby="message">
      <div class="rays" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <canvas id="confetti" aria-hidden="true"></canvas>

      <header class="header">
        <span class="edition">捜索記録 <span class="edition-divider">/</span> No. 06</span>
        <button class="sound-button" id="sound" type="button" aria-pressed="false" aria-label="演出の音を出す" hidden>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-mute" d="m16 9 5 6m0-6-5 6"/></svg>
          <span id="sound-label">音を出す</span>
        </button>
      </header>

      <section class="reveal">
        <div class="eyebrow" aria-hidden="true"><span></span> MISSING PERSON <span></span></div>
        <div class="headline-wrap">
          <p class="headline" aria-hidden="true"><span>発</span><span>見</span><i>!</i></p>
          <span class="headline-outline" aria-hidden="true">発見!</span>
        </div>

        <figure class="portrait-card">
          <span class="card-corner top-left" aria-hidden="true"></span>
          <span class="card-corner bottom-right" aria-hidden="true"></span>
          <div class="portrait">
            <img src="./docs/poster.jpg" width="1052" height="1494" alt="捜索ポスターに載っていた人物" fetchpriority="high">
            <span class="portrait-sheen" aria-hidden="true"></span>
          </div>
          <figcaption><span>行方不明</span><b>捜索終了</b><span>No. 06</span></figcaption>
          <div class="stamp" aria-hidden="true">発見済<span>FOUND</span></div>
        </figure>

        <div class="message-wrap">
          <p class="small-message">あなたが、見つけた。</p>
          <h1 id="message">見つけてくれて、<br>ありがとう。</h1>
          <div class="finish-rule" aria-hidden="true"><span></span>完<span></span></div>
        </div>
      </section>

      <footer class="footer">
        <span class="footer-note">誘界 <span>/</span> 捜索終了</span>
        <button class="replay" id="replay" type="button" hidden><span aria-hidden="true">↻</span> もう一回</button>
      </footer>
    </main>
    <noscript><p class="no-script">見つけてくれて、ありがとう。</p></noscript>
  </body>
</html>
